<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SmartRule Automate Composer</title><desc id="desc">Repository card showing a trigger, condition, and action composed into an automation rule.</desc>
  <rect width="1200" height="630" fill="#F2EFE7"/><text x="82" y="142" fill="#445E7C" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">OFFLINE RULE COMPOSITION</text><text x="82" y="218" fill="#1A2530" font-family="Arial,sans-serif" font-size="54" font-weight="700">SmartRule Automate Composer</text><text x="84" y="263" fill="#586672" font-family="Arial,sans-serif" font-size="24">A visual composition path with isolated automation adapters.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="360" width="260" height="130" rx="20" fill="#FFFDF8" stroke="#445E7C" stroke-width="3"/><text x="220" y="412" fill="#445E7C" font-size="17" font-weight="700">WHEN</text><text x="220" y="448" fill="#1A2530" font-size="22">door opens</text><path d="M350 425 H450" stroke="#BE7C45" stroke-width="5"/><rect x="450" y="360" width="260" height="130" rx="20" fill="#FFFDF8" stroke="#445E7C" stroke-width="3"/><text x="580" y="412" fill="#445E7C" font-size="17" font-weight="700">IF</text><text x="580" y="448" fill="#1A2530" font-size="22">after sunset</text><path d="M710 425 H810" stroke="#BE7C45" stroke-width="5"/><rect x="810" y="360" width="300" height="130" rx="20" fill="#1A2530"/><text x="960" y="412" fill="#D9A15B" font-size="17" font-weight="700">THEN</text><text x="960" y="448" fill="#FFFDF8" font-size="22">turn lights on</text></g>
</svg>
